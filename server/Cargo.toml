[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
httpdate = "1"
hyper = { version = "1.11", features = ["full"] }
jsonwebtoken = "11"
mime_guess = "2"
futures-util = "0.3"
governor = "0.10"
password-hash = "0.6"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7", features = ["trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
yrs = "0.27"
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3"
